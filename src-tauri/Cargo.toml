[package]
name = "clipboard-enhancer"
version = "0.1.0"
description = "A powerful clipboard manager for efficient workflow"
authors = ["董小正 <1175639137@qq.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "clipboard_enhancer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-macos-permissions = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = { version = "3.3", features = ["image-data"] }
tokio = { version = "1", features = ["full"] }
md-5 = "0.10"
image = "0.24"
base64 = "0.22"
lru = "0.12"
chrono = "0.4"
anyhow = "1.0"
rusqlite = { version = "0.30", features = ["bundled"] }
hex = "0.4"
once_cell = "1.19"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Threading"] }
winapi = { version = "0.3", features = ["winuser", "windef"] }
enigo = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.25"
objc = "0.2"
core-foundation = "0.9"
core-graphics = "0.23"


